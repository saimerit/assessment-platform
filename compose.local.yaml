name: assessment-platform-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/start-local.ps1 first}
      ASSESSMENT_APP_DB_PASSWORD: ${ASSESSMENT_APP_DB_PASSWORD:?run scripts/start-local.ps1 first}
      ASSESSMENT_GRADER_DB_PASSWORD: ${ASSESSMENT_GRADER_DB_PASSWORD:?run scripts/start-local.ps1 first}
      CLIENT_RELEASE_URL: ${CLIENT_RELEASE_URL:?run scripts/start-local.ps1 first}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      # Run only the database bootstrap here. Later migrations are applied by
      # schema-migrate after PostgreSQL has completed its initial restart.
      - ./init-scripts/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./init-scripts/02-init-assessment-db.sql:/docker-entrypoint-initdb.d/02-init-assessment-db.sql:ro
      - ./schemas:/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d assessment_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - local_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${LOCAL_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/start-local.ps1 first}
      ASSESSMENT_APP_DB_PASSWORD: ${ASSESSMENT_APP_DB_PASSWORD:?run scripts/start-local.ps1 first}
      ASSESSMENT_GRADER_DB_PASSWORD: ${ASSESSMENT_GRADER_DB_PASSWORD:?run scripts/start-local.ps1 first}
      CLIENT_RELEASE_URL: ${CLIENT_RELEASE_URL:?run scripts/start-local.ps1 first}
    volumes:
      - ./init-scripts:/migrations:ro
    entrypoint:
      - sh
      - -ec
      - |
        for migration in /migrations/03_enterprise_rbac_and_invites.sql /migrations/04_candidate_intake_config.sql /migrations/05_question_authoring_and_client_releases.sql /migrations/06_secure_assessment_events.sql /migrations/07_candidate_org_invitations.sql /migrations/08_multi_choice_answers.sql /migrations/09_randomized_event_papers.sql; do
          psql -h postgres -U root -d assessment_db -v ON_ERROR_STOP=1 -f "$$migration"
        done

  api:
    build: ./assessment-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      ASSESSMENT_API_PORT: "8080"
      ASSESSMENT_DATABASE_URL: postgres://assessment_app:${ASSESSMENT_APP_DB_PASSWORD}@postgres:5432/assessment_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?run scripts/start-local.ps1 first}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?run scripts/start-local.ps1 first}
      CLIENT_RELEASE_URL: ${CLIENT_RELEASE_URL:?run scripts/start-local.ps1 first}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  portal:
    build: ./admin-portal
    restart: unless-stopped
    environment:
      PORT: "3000"

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_started
    ports:
      - "${LOCAL_PORT:-3000}:80"
    volumes:
      - ./ops/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro

  grading-worker:
    build: ./grading-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      GRADING_DATABASE_URL: postgres://assessment_grader:${ASSESSMENT_GRADER_DB_PASSWORD}@postgres:5432/assessment_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

  notification-worker:
    build: ./notification-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      ASSESSMENT_DATABASE_URL: postgres://assessment_app:${ASSESSMENT_APP_DB_PASSWORD}@postgres:5432/assessment_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?run scripts/start-local.ps1 first}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SENDER: ${SMTP_SENDER:-}

volumes:
  local_pgdata:
  local_redisdata:
